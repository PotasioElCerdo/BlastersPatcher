<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLASTERS++ Patcher</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ecebf7;--ink:#16123a;--mut:#5b5880;--card:#fff;--line:#bdb9e3;--red:#e8372c;--redt:#fff;--teal:#087f7a;--tealbg:#e2f6f4;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15122e;--ink:#ecebfa;--mut:#a9a6d0;--card:#1f1b40;--line:#3f3a78;--red:#ff5a4d;--redt:#1a0604;--teal:#3fdcd3;--tealbg:#123a3d;--err:#ff8a80}}
:root[data-theme=dark]{--bg:#15122e;--ink:#ecebfa;--mut:#a9a6d0;--card:#1f1b40;--line:#3f3a78;--red:#ff5a4d;--redt:#1a0604;--teal:#3fdcd3;--tealbg:#123a3d;--err:#ff8a80}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:40px 20px 72px}
h1{font-size:clamp(40px,8vw,84px);line-height:.95;letter-spacing:-.03em;font-weight:800;margin:0 0 16px}
h1 span{color:var(--red)}
.lead{max-width:52ch;color:var(--mut);font-size:19px;margin:0 0 36px}
.zones{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.zone{display:flex;flex-direction:column;gap:6px;min-height:200px;padding:20px;background:var(--card);border:2px dashed var(--line);border-radius:18px;cursor:pointer;transition:border-color .15s,background .15s}
.zone:hover,.zone.drag,.zone:focus-visible{border-color:var(--red);outline:none}
.zone.drag{background:var(--tealbg)}
.zone .n{font-weight:800;font-size:15px;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.zone b{font-size:24px;letter-spacing:-.01em;margin-top:8px}
.zone small{color:var(--mut);font-size:14px}
.zone .file{margin-top:auto;font-size:14px;word-break:break-all}
.zone.ok{border:2px solid var(--teal);background:var(--tealbg)}
.zone.ok .n{background:var(--teal);color:var(--bg)}
.zone .bad{color:var(--err);font-size:14px}
.act{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin:28px 0 8px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:14px 28px;cursor:pointer;background:var(--red);color:var(--redt);font-size:18px}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.fine{color:var(--mut);font-size:14px;max-width:58ch;margin:0}
#bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:28px 0 12px;display:none}
#bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .2s}
#log{list-style:none;padding:0;margin:0;display:grid;gap:4px;font-size:15px}
#log li{color:var(--mut)}#log li:last-child{color:var(--ink);font-weight:600}
#err{display:none;margin-top:16px;padding:14px 18px;border-left:5px solid var(--err);background:var(--card);color:var(--err);border-radius:8px;font-weight:600}
#out{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:28px}
.res{background:var(--card);border:2px solid var(--teal);border-radius:18px;padding:20px}
.res h3{margin:0 0 4px;font-size:22px}.res p{margin:0 0 12px;color:var(--mut);font-size:15px;word-break:break-all}
.res details{margin:0 0 14px;font-size:14px;max-height:180px;overflow:auto}
.res summary{cursor:pointer;font-weight:600}
@media(max-width:720px){.zones{grid-template-columns:1fr}.zone{min-height:150px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>BLASTERS<span>++</span> patcher</h1>
<p class="lead">Add your Yo-kai Watch Blasters game, its update and the BLASTERS++ mod. You get the game and the update back, both patched.</p>
<section class="zones" aria-label="Files">
<label class="zone" tabindex="0" data-k="game"><span class="n">1</span><b>Game</b><small>.cia, .cci, .3ds, or a .zip containing one</small><span class="file"></span><input type="file" hidden accept=".cia,.cci,.3ds,.zip"></label>
<label class="zone" tabindex="0" data-k="update"><span class="n">2</span><b>Update</b><small>.cia, .cci, .3ds, or a .zip containing one</small><span class="file"></span><input type="file" hidden accept=".cia,.cci,.3ds,.zip"></label>
<label class="zone" tabindex="0" data-k="mod"><span class="n">3</span><b>BLASTERS++ mod</b><small>The .rar with a romfs folder inside</small><span class="file"></span><input type="file" hidden accept=".rar"></label>
</section>
<div class="act"><button id="go" disabled>Patch files</button><p class="fine">Everything runs in your browser and nothing is uploaded. Files must be decrypted dumps, and large ones need a few GB of free memory.</p></div>
<div id="bar"><i></i></div><ol id="log"></ol><div id="err" role="alert"></div><section id="out" aria-live="polite"></section>
</main>

async function patchRomfs(blob,rf,mod,cb){

async function build(blob,c,rp,cb){
const n=c.ncch,h=new Uint8Array(n.hdr),hv=dv(h),tailOff=c.ncchOff+n.romOff+n.romSize,tailEnd=c.ncchOff+n.size;
const tail=tailEnd>tailOff?blob.slice(tailOff,tailEnd):null,size=n.romOff+rp.size+(tail?tail.size:0);

/* ---- UI ---- */
const log=t=>{const li=document.createElement('li');li.textContent=t;$('#log').append(li)};
const prog=f=>$('#bar i').style.width=Math.round(Math.min(f,1)*100)+'%';
const ok=k=>/\.(cia|cci|3ds|zip)$/i.test(S[k].name)||0;
document.querySelectorAll('.zone').forEach(z=>{const k=z.dataset.k,inp=z.querySelector('input'),ext=k==='mod'?/\.rar$/i:/\.(cia|cci|3ds|zip)$/i;
const set=f=>{if(!f)return;const fl=z.querySelector('.file');
if(!ext.test(f.name)){delete S[k];z.classList.remove('ok');fl.className='file bad';fl.textContent=k==='mod'?'Choose a .rar file.':'Choose a .cia, .cci, .3ds or .zip file.'}
else{S[k]=f;z.classList.add('ok');fl.className='file';fl.textContent=`${f.name} (${fmt(f.size)})`}
$('#go').disabled=!(S.game&&S.update&&S.mod)};
inp.onchange=()=>set(inp.files[0]);z.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click()}};
z.ondragover=e=>{e.preventDefault();z.classList.add('drag')};z.ondragleave=()=>z.classList.remove('drag');
z.ondrop=e=>{e.preventDefault();z.classList.remove('drag');set(e.dataTransfer.files[0])}});
async function save(blob,name){
const ext=name.match(/\.[^.]+$/)[0];const zp=new Libs.zip.ZipWriter(new Libs.zip.BlobWriter('application/zip'),{level:0});
await zp.add(name,new Libs.zip.BlobReader(blob));const z=await zp.close(),dl=await (window.claude?claude.use('downloads'):null);
if(dl)await dl.save({filename:name.replace(/\.[^.]+$/,'')+'.zip',data:z});
else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}}
async function patch(k,i){
prog(i/2);const cb=f=>prog((i+f*.9)/2),{blob,name}=await unwrap(S[k],k,f=>prog((i+f*.1)/2));
log(`Reading ${k}: ${name}`);const c=await openContainer(blob),rf=await parseRomfs(blob,c.ncchOff+c.ncch.romOff);
log(`Found ${rf.files.length} files in the ${k} RomFS`);
const rp=await patchRomfs(blob,rf,S.mapped,cb);
if(!rp){log(`Nothing to replace in the ${k}; it stays as it is`);return null}
log(`Replaced ${rp.hit.length} files in the ${k}. Rebuilding…`);
const out=await build(blob,c,rp,cb),ext=name.match(/\.[^.]+$/)[0];
return{name:name.replace(/\.[^.]+$/,'')+' (BLASTERS++)'+ext,blob:out,paths:rp.hit.map(f=>f.path),k}}
$('#go').onclick=async()=>{const go=$('#go');go.disabled=true;$('#out').innerHTML='';$('#log').innerHTML='';$('#err').style.display='none';$('#bar').style.display='block';prog(0);
try{log('Reading the BLASTERS++ archive');S.mapped=await loadMod(S.mod);log(`The mod has ${S.mapped.size} files inside romfs`);
let i=0;const res=[];for(const k of['game','update']){const x=await patch(k,i++);if(x)res.push(x)}
prog(1);log(res.length?'Done. Save your patched files below.':'Done, but none of the mod files matched.');
for(const x of res){const d=document.createElement('div');d.className='res';d.innerHTML='<h3></h3><p></p><details><summary></summary><div></div></details><button>Save patched '+x.k+'</button>';
d.querySelector('h3').textContent=x.k[0].toUpperCase()+x.k.slice(1)+' patched';d.querySelector('p').textContent=`${x.name} · ${fmt(x.blob.size)}`;
d.querySelector('summary').textContent=`${x.paths.length} files replaced`;d.querySelector('div').innerText=x.paths.join('\n');
const b=d.querySelector('button');b.onclick=async()=>{b.disabled=true;b.textContent='Preparing zip…';try{await save(x.blob,x.name);b.textContent='Saved. Extract the zip to get the file'}catch(e){b.textContent=e.code==='declined'?'Save patched '+x.k:'Save failed, try again'}b.disabled=false};$('#out').append(d)}
}catch(e){const m=$('#err');m.style.display='block';m.textContent=e.message||String(e);console.error(e)}
go.disabled=false};
